[versions]
agp = "8.12.0"
kotlin = "2.4.0"
room = "2.5.1"
lifecycle = "2.8.7"
core-ktx = "1.13.0"

[libraries]
junit = "junit:junit:4.13.2"
kotlin = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.require = "core-ktx" }
multidex-instrumentation = "androidx.multidex:multidex-instrumentation:2.0.0"
multidex = "androidx.multidex:multidex:2.0.1"
room = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
appcompat = "androidx.appcompat:appcompat:1.8.0"
viewmodel-android = { module = "androidx.lifecycle:lifecycle-viewmodel-android", version.ref = "lifecycle" }
viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
ktx-serialization-json = "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
ktx-coroutines-android = "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
recyclerview = "androidx.recyclerview:recyclerview:1.3.0"
cardview = "androidx.cardview:cardview:1.0.0"
palette-ktx = "androidx.palette:palette-ktx:1.0.0"
legacy = "androidx.legacy:legacy-support-v4:1.0.0"
vectordrawable = "androidx.vectordrawable:vectordrawable:1.1.0"
constraintlayout = "androidx.constraintlayout:constraintlayout:2.1.4"
material = "com.google.android.material:material:1.10.0"
retrofit = "com.squareup.retrofit2:retrofit:3.0.0"
retrofit-apt-rxjava = "com.squareup.retrofit2:adapter-rxjava3:3.0.0"
okhttp = "com.squareup.okhttp3:okhttp:5.5.0"
okhttp-log-interceptor = "com.squareup.okhttp3:logging-interceptor:5.5.0"
gson = "com.google.code.gson:gson:2.14.0"
fastjson ="com.alibaba:fastjson:1.2.58"
rxjava = "io.reactivex.rxjava3:rxjava:3.1.12"
rxjava-rxandroid = "io.reactivex.rxjava3:rxandroid:3.0.2"
rxpermissions = "com.github.tbruyelle:rxpermissions:0.10.2"
javax-annotation = "javax.annotation:javax.annotation-api:1.3.2"
glide = "com.github.bumptech.glide:glide:4.9.0"
glide-integration = "com.github.bumptech.glide:okhttp3-integration:4.9.0"
glide-compiler = "com.github.bumptech.glide:compiler:4.9.0"
refresh-layout = "io.github.scwang90:refresh-layout-kernel:3.0.0-alpha"
live-event-bus = "io.github.jeremyliao:live-event-bus-x:1.8.0"
photoview = "com.github.chrisbanes:PhotoView:2.1.4"
zxing = "com.google.zxing:core:3.3.0"

[bundles]
glide = ["glide", "glide-integration"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp"}
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version = "2.3.11" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
