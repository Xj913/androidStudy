[versions]
compileSdk = "37"
minSdk = "24"
targetSdk = "36"
ndk = "29.0.14206865"
agp = "9.1.0"
ksp = "2.3.11"
kotlin = "2.4.20"
room = "2.5.1"
lifecycle = "2.11.0"
coreKtx = "1.13.0"
nav3Core = "1.1.4"
lifecycleViewmodelNav3 = "2.11.0"
kotlinSerialization = "2.2.21"
kotlinxSerializationCore = "1.11.0"
material3AdaptiveNav3 = "1.2.0"

[libraries]
junit = "junit:junit:4.13.2"
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
kotlin = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
org-annotations = "org.jetbrains:annotations:23.0.0"
ktx-serialization-json = "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
ktx-coroutines-android = "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
compose-bom = "androidx.compose:compose-bom:2026.06.00"
ax-core-ktx = { module = "androidx.core:core-ktx", version.require = "coreKtx" }
room = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
material3.module = "androidx.compose.material3:material3"
foundation.module = "androidx.compose.foundation:foundation"
compose-ui.module = "androidx.compose.ui:ui"
preview.module = "androidx.compose.ui:ui-tooling-preview"
adaptive.module = "androidx.compose.material3.adaptive:adaptive"
acyivity-compose = "androidx.activity:activity-compose:1.13.0"
hilt-navigation-compose = "androidx.hilt:hilt-navigation-compose:1.0.0"
compose-livedata.module = "androidx.compose.runtime:runtime-livedata"
compose-rxjava3.module = "androidx.compose.runtime:runtime-rxjava3"
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" }
viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelNav3" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleViewmodelNav3" }
viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerializationCore" }
adaptive-navigation3 = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation3", version.ref = "material3AdaptiveNav3" }
appcompat = "androidx.appcompat:appcompat:1.8.0"
coordinatorlayout = "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycleViewmodelNav3" }
viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
recyclerview = "androidx.recyclerview:recyclerview:1.3.0"
cardview = "androidx.cardview:cardview:1.0.0"
palette-ktx = "androidx.palette:palette-ktx:1.0.0"
legacy = "androidx.legacy:legacy-support-v4:1.0.0"
vectordrawable = "androidx.vectordrawable:vectordrawable:1.1.0"
constraintlayout = "androidx.constraintlayout:constraintlayout:2.1.4"
gson = "com.google.code.gson:gson:2.14.0"
hilt = "com.google.dagger:hilt-android:2.60.1"
hilt-compiler = "com.google.dagger:hilt-android-compiler:2.60.1"
zxing = "com.google.zxing:core:3.3.0"
material = "com.google.android.material:material:1.10.0"
retrofit = "com.squareup.retrofit2:retrofit:3.0.0"
retrofit-apt-rxjava = "com.squareup.retrofit2:adapter-rxjava3:3.0.0"
okhttp = "com.squareup.okhttp3:okhttp:5.5.0"
okio = "com.squareup.okio:okio:3.10.0"
okhttp-log-interceptor = "com.squareup.okhttp3:logging-interceptor:5.5.0"
fastjson ="com.alibaba:fastjson:1.2.58"
javax-annotation = "javax.annotation:javax.annotation-api:1.3.2"
rxjava = "io.reactivex.rxjava3:rxjava:3.1.12"
rxjava-rxandroid = "io.reactivex.rxjava3:rxandroid:3.0.2"
glide = "com.github.bumptech.glide:glide:4.9.0"
glide-integration = "com.github.bumptech.glide:okhttp3-integration:4.9.0"
glide-compiler = "com.github.bumptech.glide:compiler:4.9.0"
live-event-bus = "io.github.jeremyliao:live-event-bus-x:1.8.0"
rxpermissions = "com.github.tbruyelle:rxpermissions:0.10.2"
refresh-layout = "io.github.scwang90:refresh-layout-kernel:3.0.0-alpha"
photoview = "com.github.chrisbanes:PhotoView:2.1.4"

[bundles]
glide = ["glide", "glide-integration"]
compose = ["material3", "foundation", "compose-ui", "preview", "acyivity-compose", "hilt-navigation-compose",
    "viewmodel-compose", "lifecycle-viewmodel", "viewmodel-ktx", "livedata-ktx", "compose-livedata", "lifecycle-runtime-compose",
    "compose-rxjava3","navigation3-runtime", "navigation3-ui", "viewmodel-navigation3", "kotlinx-serialization-core", "hilt"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp"}
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
